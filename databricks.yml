# This is a Declarative Automation Bundle definition for databricks-reusable-demo.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: databricks-reusable-demo

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-16aad3cb-14ec.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-16aad3cb-14ec.cloud.databricks.com

resources:
  jobs:
    daily_revenue_job:
      name: "Daily Revenue Summary"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
      tasks:
        - task_key: daily_revenue
          notebook_task:
            notebook_path: ./notebooks/daily_revenue_summary_source.py
