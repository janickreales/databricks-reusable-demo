# This is a Declarative Automation Bundle definition for databricks-reusable-demo.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: databricks-reusable-demo

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-16aad3cb-14ec.cloud.databricks.com

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-16aad3cb-14ec.cloud.databricks.com

resources:
  jobs:
    trip_summary_job:
      name: "Trip Summary - Format Comparison"
      tasks:
        - task_key: source_format_notebook
          notebook_task:
            notebook_path: ./notebooks/trip_summary_source.py
        - task_key: ipynb_format_notebook
          notebook_task:
            notebook_path: ./notebooks/trip_summary.ipynb
